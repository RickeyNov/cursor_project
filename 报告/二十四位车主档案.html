<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二十四位车主档案</title>
<style>
  :root {
    --ink: #1a1612;
    --muted: #6d645a;
    --line: rgba(26,22,18,.12);
    --paper: #f3eee6;
    --sheet: #faf7f2;
    --rail: #171410;
    --rail-text: #efe8dc;
    --rail-dim: #a3988a;
    --cinnabar: #8d3b32;
    --gold: #b08958;
    --chip: #efe6d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "WenQuanYi Micro Hei", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--paper);
    letter-spacing: .01em;
  }
  .app { height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  header.top {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    padding: 28px 36px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #f7f3ec 0%, #f3eee6 100%);
  }
  .eyebrow {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--cinnabar); font-family: "Liberation Serif", "Noto Serif", serif;
  }
  h1 { margin: 0; font-weight: 500; font-size: 34px; letter-spacing: .08em; }
  .deck { margin: 8px 0 0; max-width: 640px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .count {
    font-family: "Liberation Serif", serif; font-size: 42px; line-height: 1; color: var(--ink);
  }
  .count span { display: block; margin-top: 6px; font-family: inherit; font-size: 12px; letter-spacing: .18em; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 392px minmax(0, 1fr); min-height: 0; }
  aside {
    background: var(--rail); color: var(--rail-text);
    display: flex; flex-direction: column; min-height: 0;
  }
  .tools { padding: 18px 18px 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
  input[type="search"] {
    width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    color: var(--rail-text); border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 14px;
    outline: none;
  }
  input[type="search"]::placeholder { color: var(--rail-dim); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .filters button, .gfilters button {
    border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--rail-dim);
    border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .filters button.on, .gfilters button.on { background: #f3eee6; color: var(--ink); border-color: #f3eee6; }
  .gfilters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .index { overflow: auto; padding: 8px; }
  .person {
    width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
    padding: 12px 12px 12px 14px; border-radius: 12px; cursor: pointer;
    display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: start;
  }
  .person:hover { background: rgba(255,255,255,.04); }
  .person.on { background: rgba(243,238,230,.1); }
  .num { font-family: "Liberation Serif", serif; color: var(--gold); font-size: 13px; padding-top: 3px; }
  .person strong { display: block; font-weight: 500; font-size: 16px; letter-spacing: .06em; }
  .meta { color: var(--rail-dim); font-size: 12px; margin-top: 3px; line-height: 1.5; }
  main { overflow: auto; min-height: 0; background:
    radial-gradient(1200px 400px at 100% -10%, rgba(176,137,88,.16), transparent 50%),
    var(--sheet); }
  article { max-width: 820px; margin: 0 auto; padding: 42px 48px 80px; }
  .kicker { color: var(--cinnabar); letter-spacing: .16em; font-size: 12px; margin: 0 0 10px; }
  article h2 { margin: 0; font-size: 40px; font-weight: 500; letter-spacing: .12em; }
  .sub { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  .lead {
    margin: 22px 0 8px; font-size: 16px; line-height: 1.85; padding-bottom: 8px;
  }
  section { margin-top: 28px; padding-top: 8px; border-top: 1px solid var(--line); }
  section h3 { margin: 16px 0 12px; font-size: 18px; font-weight: 500; letter-spacing: .04em; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { margin: 0 0 14px; line-height: 1.8; font-size: 15px; }
  li em { font-style: normal; color: var(--cinnabar); margin-right: 6px; }
  .empty { padding: 48px 20px; color: var(--rail-dim); text-align: center; }
  .navrow { display: flex; gap: 8px; margin-top: 28px; }
  .navrow button {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font: inherit; cursor: pointer; color: var(--ink);
  }
  @media (max-width: 960px) {
    header.top { padding: 20px 18px 14px; flex-direction: column; align-items: flex-start; }
    h1 { font-size: 28px; }
    .layout { grid-template-columns: 1fr; }
    aside { max-height: 46vh; }
    article { padding: 28px 18px 64px; }
    article h2 { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">Chengdu · Beijing · Hangzhou · October 2026</p>
      <h1>二十四位车主档案</h1>
      <p class="deck">按访谈原文整理。每人一份档案：个人与家庭、购车背景、竞品与决策、对BBA和新能源豪华品牌的看法、再购展望。听写不清的价格和岗位不写成唯一数字。</p>
    </div>
    <div class="count">24<span>位车主</span></div>
  </header>
  <div class="layout">
    <aside>
      <div class="tools">
        <input id="q" type="search" placeholder="搜索姓名、城市或车型" aria-label="搜索">
        <div class="filters" id="cities"></div>
        <div class="gfilters" id="groups"></div>
      </div>
      <div class="index" id="index"></div>
    </aside>
    <main><article id="doc"></article></main>
  </div>
</div>
<script>
const DATA = [{"id": "mou", "name": "牟佳陶", "city": "成都", "car": "迈巴赫 S480", "group": "迈巴赫", "kicker": "33岁 · 日用品制造 · 落地约130万出头", "lead": "本次面聊围绕牟佳陶从奔驰GLE换到迈巴赫S480的过程展开。他和父母一起做日用品制造，尚未结婚。购车时主要在BBA里比较，客户要一眼认出奔驰；尊界试驾过但没有替换这台车。下一台若再增加，他优先看华为系新能源，正式见老客户时仍倾向留下迈巴赫。", "sections": [["1. 个人背景与家庭情况", [["年龄与家庭", "访谈员称他33岁，他没有改口。和父母一起做日用品制造，尚未结婚。爱好里提到网球和骑行。生意以成都周边为主，也会出省。"], ["用车分工", "迈巴赫挂在他个人名下，自己开。家里还有奔驰GLE，尾号6，限号日换开，父亲也会开。政府人员来厂检查、客户来访时用轿车接。"]]], ["2. 购车背景", [["换车路径", "GLE之前是帕萨特。GLE开顺了，想在同一品牌里买一台更好、远看就能认出的轿车。记录按2025款迈巴赫在谈。"], ["预算与成交", "心里一百万以内舒服，顶到150万会肉疼，因为公司需要钱。落地他先说一百二十五万，后又说一百三十多万、可能一百三十五万。"], ["使用场景", "轿车坐姿舒服，接人有面子。近郊轿车够用，五百公里以上他更愿意坐飞机或高铁，不打算为了玩再加一台SUV。三人以上才觉得该开MPV。"]]], ["3. 竞品对比与决策因素", [["比较范围", "认真选的是BBA。宝马开过朋友的车，觉得偏家庭，没有奔驰的商务感。奥迪A8去看过，更便宜，但觉得老气，像开父亲的车。"], ["尊界", "试驾过S800。外观他觉得太新，内饰木纹又觉得适合父亲那一辈；水晶和皮料他认为有豪华感。没有用它替换迈巴赫。"], ["决定性原因", "客户对奔驰接受度高，GLE已经开顺手，轿车坐姿和辨识度都合适。品牌在燃油商务上是门槛；新能源他明确说看产品，不认谁是豪华品牌。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["BBA", "燃油车只把BBA当宽认知，别的牌子要在别人脑子里转一下才知道级别。迈巴赫是辨识度最高的一档。二三十岁开迈巴赫，同龄老板可能觉得是父亲的车。"], ["华为与其他新能源", "智驾他试过华为，堵车和长途都想用，甚至说可以看微信。蔚来稍好、服务他愿意多花一二十万，但不接受换电。小米车机好用，智驾不好。五六十岁客户往往只知道华为，分不清是哪个“界”。"], ["价格感觉", "新能源轿车他能接受约一百万、不超过一百二十万。极氪、腾势若做同级，他觉得价值要比这台迈巴赫低三十多万。比亚迪好感略高于吉利，不因网约车多而否定。"]]], ["5. 对未来购车的展望", [["下一台", "若再增加一台，优先华为系新能源，和现有两台油车里置换一台，不是再加第三台。轿车优先于再买SUV，人多再考虑MPV。"], ["仍留迈巴赫的场合", "正式场合和见老客户仍倾向传统豪华。出省谈合同若要停下来充三四百到五百公里，他不用纯电。"], ["接受条件", "闪充若能压到大约二十分钟、实际续航五百公里以上，他说以后可以不再买油车。"]]]]}, {"id": "dong", "name": "董阿特", "city": "北京", "car": "迈巴赫 S480", "group": "迈巴赫", "kicker": "39岁 · 不锈钢出口 · 成交口径约一百六十万", "lead": "本次面聊围绕董阿特购买迈巴赫S480的商务理由展开。他做薄壁不锈钢，客户在中东和非洲。有客户时几乎由专职司机开，自己通勤仍开这台长轿车。家里已有小鹏X9做家用。外国客户几乎只认奔驰，家用他明确会用新能源。", "sections": [["1. 个人背景与家庭情况", [["年龄与行业", "自报39岁。金属加工，薄壁不锈钢304和316，主要做中东、非洲的进出口。忙闲看项目，不是稳定的朝九晚五。爱好是出门、羽毛球和在家看电影。"], ["家庭用车", "此前个人有奔驰S级作接待，已被这台迈巴赫换掉。公司有奥迪A6。爱人更多开小鹏X9，当初为岳母放轮椅和行李箱而买。"]]], ["2. 购车背景", [["为什么是迈巴赫", "那些国家奔驰是一哥，迈巴赫是奔驰里的一哥。宝马被那些客户看成家用，不能商用。他不要高坐姿，宁可北京堵、车长，也自己开轿车。"], ["成交", "口径接近一百六十万。后文另有“接近二百万”的说法，不采成成交价。奥迪是旧爱，但公司已有A6，再买A8像买了两台一样的车。"], ["后排", "座椅支撑是购买初衷。接待坐后排，也提到谈合同时怕司机听见，想要前后排隐私隔断。"]]], ["3. 竞品对比与决策因素", [["没有换成尊界", "朋友的尊界他坐过。功能更先进、空间更好，内饰他觉得偏土豪、堆料，少创新。没有用它替换迈巴赫。"], ["SUV", "SUV在他这里是功能车。真要买，要像G级或带差速锁，为通过性，不为接待、不为通勤。仰望U8看过，出行要坐六个人又没有指标，先搁置。"], ["决策权重", "燃油商务品牌是门槛。家用电车看功能和成本，可以换品牌。太便宜的行政轿车（他举小米SU7被拿去当行政的例子）在商务里会被调侃。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["奔驰与宝马", "外国客户几乎只认奔驰。宝马在那些客户里不能商用。奔驰这套车机仍不如他见过的国产新能源，“你好奔驰”经常要说第二遍。"], ["家用新能源", "他接受电车做家用：智驾、用车成本低。不接受电车静到没有白噪音，觉得会晕。小鹏X9智驾强、成本低，安静过头。"], ["其他牌子", "比亚迪做了约三十年，他认为有资格做豪华。腾势被D9锁成MPV，Z系列影响力小。蔚来做得早，没买车也被招待过咖啡。理想没有行业沉淀，做豪华轿车未必执着。华为手机性价比高，那是手机不是车。"]]], ["5. 对未来购车的展望", [["分工不变", "家用他说肯定用新能源。接待中东、非洲客户不会离开奔驰。公司以后可能另加一台新能源越野。"], ["换车节奏", "他自己换手机和车大约三到五年，也说不喜欢用旧的。没有把迈巴赫换成SUV的计划。"]]]]}, {"id": "qu", "name": "瞿国剑", "city": "杭州", "car": "迈巴赫 S480", "group": "迈巴赫", "kicker": "三口之家 · 设备检修 · 落地一百二十多万", "lead": "本次面聊围绕瞿国剑自己开迈巴赫S480、家人开极氪的分工展开。客户多是大约五十四五岁的钢厂、化工厂工程师，认得出奔驰。他不排斥新能源，条件是内饰工艺要接近迈巴赫。现在他认为别人都在做大六座，轿车内饰还没到他要的程度。", "sections": [["1. 个人背景与家庭情况", [["家庭与公司", "三口之家，孩子已经22岁，都是杭州人。自己开小公司，注册大约11人，做大型机械设备检修，客户是钢厂和化工厂。业务偏配套，时间比较自由。"], ["家里的车", "上一台奔驰E300L开了约五年。太太今年提了极氪，之前是Model 3。两台不互相替代：轿车他自己开，SUV是太太的，后来也用来装露营的东西。"]]], ["2. 购车背景", [["为什么从E级上到迈巴赫", "客户大约五十四五岁，辨识度仍算给迈巴赫，高于S800。品牌在决策里他说至少占一半。落地一百二十多万、不到一百三十万。"], ["自己开", "到公司大约两公里，没有专职司机。商务一般带一名技术工程师。车太长，医院和楼下机械车位不好停，是他说的主要缺陷。"], ["预算感觉", "这台在他心里是一百万出头的传统豪华轿车。E级和宝马3系能到三十万以内之后，传统品牌溢价撑不住两倍、两倍半。"]]], ["3. 竞品对比与决策因素", [["宝马与尊界", "宝马内饰被他看低。买的时候完全没把尊界放进考虑。事后认为这个价位的纯电轿车几乎没有对手，但细节不好，木头偏老。尊界刹车事件会扣分。"], ["内饰是门槛", "电车内饰他比成三十万装修对九十五分，旧Model 3是毛坯房。头部新能源若做出迈巴赫这种内饰，他会考虑。"], ["其他", "极氪若做同级行政轿车，他口头能接受约八十万。仰望约一百万以上。腾势约六七十万。岚图六十万到顶还要看实车。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["奔驰", "客户认得出。油耗他不太关注，车机和手机应用确实跟新能源没法比。纯电谈事情没有发动机震动，这是他承认的好处。"], ["新能源头部", "华为几个“界”、蔚来、极氪他算头部。小米算中端，做工对得起价格，不是头部。比亚迪牌子本身他觉得没有特别好的车，除了仰望；仰望技术堆得怪，内饰看不出七八十万。"], ["腾势", "中等偏上，比极氪低一点。D9和SUV多见，Z9 GT他知道。不知道腾势曾和奔驰合作。"]]], ["5. 对未来购车的展望", [["仍是中大型轿车", "历史换车周期约六年。外观可以再年轻，功能向电车借，但要讲清和新能源的安全差异。客户辨识度还在迈巴赫。"], ["续航", "六百、七百公里他就够，因为高压快充。极氪城区智驾他不放心，岔路和匝道会退出，他想要华为那种稳定。"]]]]}, {"id": "liao", "name": "廖慧娴", "city": "成都", "car": "宝马7系", "group": "7系", "kicker": "33岁 · 医美 · 她用来比较的价格是七八十万", "lead": "本次面聊围绕廖慧娴从父亲的宝马5系换成自己的7系展开。她做医美，要看起来有沉淀又不要老气。奔驰内饰她觉得更偏男性，保时捷大车像父亲开的。纯电没有买，主因是续航焦虑和家里充电不方便。下一台会看可信的新能源，不靠它撑面子。", "sections": [["1. 个人背景与家庭情况", [["年龄与工作", "自报若是23岁才会把内饰改成粉色，实际是33岁。自己做医美店铺和项目，不是谈两百万大单的生意，接触的女性客户多。"], ["家庭", "男朋友会看车。父母在，家里有狗。孩子还没有，她用“如果生了孩子”来谈以后。上一台长期开的是父亲的5系。"]]], ["2. 购车背景", [["动机", "开出去要有面，灯要有辨识度，座椅要舒服。参数和零到一百她觉得在成都城区没有意义。内饰选了橙棕，要沉稳里带一点活泼。"], ["价格", "访谈员说到手八十多万，她自己用七八十万去比小米。精确合同价没有由她报出。配置她说是尊享、顶配。以前觉得一百万以上才算豪华，现在把线放到六十万以上，一百万她自己有困难。"], ["谁决定", "决策是她。受父亲的宝马和认识的销售影响，男朋友提供华为、AMG一类信息。"]]], ["3. 竞品对比与决策因素", [["奔驰与保时捷", "奔驰有一款比这台贵十来万，她分不清是S还是E，内饰觉得更适合男生，这一代7系更好看。帕拉梅拉太商务，像父亲开的。911喜欢但不符合现在。"], ["奥迪、小米、蔚来", "朋友的奥迪A4在龙泉挂不进档，她留下小毛病印象，那台不是A8。小米好看、回头率高，内饰和现在的生活不配，再年轻可能会选。蔚来算新能源里的豪华。"], ["SUV", "她觉得SUV商务感更强，而她的项目不要那么刚。座位调高才看得见车头，开着累。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["世家和新科状元", "第一台仍先锁熟牌子。BBA是面子和家底厚。同样一台车若徽章换成蔚来，八十万的宝马她觉得只能卖五六十万。"], ["纯电为什么没买", "主因不是自燃，她说油车也会烧。挡住她的是续航焦虑，家里充电不方便，工作一紧怕掉电。正规品牌过了碰撞测试她觉得安全还行。"], ["其他", "华为设计偏商务，男朋友对问界、尊界不熟，她看得少，还提到负面新闻。仰望价格和样子够豪华，她不会拿人生第一个一百万去买比亚迪。"]]], ["5. 对未来购车的展望", [["没有时间表", "方向在可信的新能源，和有孩子就换大、有空就换小跑之间，没有选定。"], ["条件", "若搬进新家、充电不再是问题，同款换成蔚来她会考虑，但仍想随时保持大约八成电。看的是电池和售后会不会垮，不是靠新能源撑面子。智驾只接受辅助，不接受放手睡觉。"]]]]}, {"id": "du", "name": "杜蕾", "city": "北京", "car": "宝马740Li", "group": "7系", "kicker": "医疗器械 · 家庭为主 · 预算从六七十万上浮", "lead": "本次面聊围绕杜蕾在摇到指标后购买宝马740Li展开。她做医疗器械，对接医院和企业，大约六七成用车是家庭。奔驰S被她看成太商务、像司机开的车。尊界产品她几乎全盘认可，最后因为家里已有理想、年长合作方看不出档次，退回自己喜欢的宝马。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "医疗行业，和医疗器械有关，对接三甲医院的主任、院长，也有企业客户，还做急救培训。家里有女儿，上初中，接送和课外班会用车。年龄访谈没有报周岁。"], ["指标与另一台车", "指标是此前摇到的，她纠正不是最近的事。家里已有理想i8，覆盖家庭体积。这台7系要和电车“中合”，也用来一对一见人。"]]], ["2. 购车背景", [["动机", "从小认宝马的辨识度，比奔驰年轻、有运动感，又不要奔驰那种高调。银行一类业务不想开车太扎眼。水晶、皮质和坐进去的感觉是她要的。"], ["预算", "原本七十万左右或六十万往上，看中这台后愿意再上一点。尊界更贵，两头一折中选了现在这台。成交价没有报出。决策是她自己，要买自己喜欢的。"], ["场景", "轿车好开，更像一对一，客人觉得被重视。四个人出行、带孩子老人或购物，她改坐i8，因为轿车挤。"]]], ["3. 竞品对比与决策因素", [["奔驰S", "太商务，设计一成不变，像司机开的车。迈巴赫没有放进候选。S已经太高调，7系的运动感用来把高调压下去。"], ["尊界", "智驾、隔音、音响、用料、车漆、关门、静音、展厅和销售她都说好。朋友开回呼和浩特全程辅助驾驶。退回宝马，是因为家里已有电车，以及比她年长十几岁的合作方感受不到档次。"], ["其他", "奥迪品牌档次还差一点。保时捷太年轻。沃尔沃安全、用料扎实，但没有设计感。蔚来ET7偏家庭，豪华感弱。问界她没有认真去看，觉得太低调。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["豪华的定义", "她要的是车主画像、用料、耐用、设计原创和绝对安全，不是冰箱和屏幕。新能源豪华她仍认为在过渡期，没有哪一个已经定论。"], ["国产序列", "尊界是把调性做在豪华上的一个。理想、蔚来偏中产和家庭。极氪像二十出头，商务感不够。比亚迪不考虑。小米是年轻人的价格。仰望像五十岁往上、偏男性，原地掉头和转椅是噱头。岚图追光的拼色她觉得有辨识度。"], ["安全", "顾虑在电池和辅助驾驶出了事责任算谁。短途她会优先选沃尔沃而不是特斯拉。"]]], ["5. 对未来购车的展望", [["没有换车计划", "时间、预算、下一台动力都没有说。方向不是更大的MPV，她说自己不可能再换一辆大型MPV。"], ["若只有一个指标", "如果没有这台家用电车、只有一个指标，会考虑尊界这种兼顾。现在的结构是电车管家庭体积，7系留下来见人。"]]]]}, {"id": "wujc", "name": "吴剑成", "city": "杭州", "car": "宝马i7", "group": "7系", "kicker": "约三十二三岁 · 物流与制造 · 两台开票各八十多万", "lead": "本次面聊围绕吴剑成临时订下两台纯电i7展开。他接受新能源，排斥的是国产电池和国产整车。BBA里只喜欢宝马的操控。尊界试驾过，豪华感和智驾他认为可以，因为是国产而不买。下一台只问新一代i7或iX5。", "sections": [["1. 个人背景与家庭情况", [["年龄与家庭", "1993年生，访谈时约三十二三岁。已婚，还没有孩子，家里就是他和妻子。妻子自己开医美。他说自己出生在杭州，也提到上海。父母是个体小包工头，已退休，基本不开车。他不和父亲坐同一辆车。"], ["公司与其他车", "水泵制造环境不好，现以物流为主，公司连劳务外派三十多人。父亲有迈巴赫，他说跟自己没关系。妻子有一台保时捷纯电，工地有交过购置税的Model 3。他自己开过多代奔驰S、帕拉梅拉和飞驰。"]]], ["2. 购车背景", [["怎么定下来的", "和妻弟在车上无聊，临时进店，手机看完配置就定了，不是计划好的那天。妻子买回来才知道。开票八十多万一台。公司上户、能抵税。一台黑、一台香槟金，香槟金是销售硬推的。"], ["用车", "出去基本上是司机开。商务常常是他加司机，客户大多自己有车。单程家到公司大约十五到十七公里。他想要而没买到的是老板座，销售把配置讲错了。"], ["为什么是纯电宝马", "电驱可以，国产电池不行。他相信BBA平台，认为BBA电车即使不保值，安全事故相对国产、甚至相对特斯拉也更可接受。家里没有任何国产电车和国产电池。续航焦虑他没有用来解释这台车。"]]], ["3. 竞品对比与决策因素", [["这次没有横向对比", "决定依据是长期只认宝马操控。奔驰开下来仍觉得老气。尊界试驾过，豪华感能接受，智驾也觉得可以，自动门和零重力没有特别到宝马没有的程度。"], ["问界与极氪", "和妻子讨论过要不要为了圈子加一台问界M9，结论是没必要。极氪009他觉得大气，看过四座，没有买。"], ["买错的配置", "三个档里他以为选了中间、带老板座，提车才发现没有。购车体验他打七分，扣分在这次；用车打九点五分。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["只认宝马的操控，并认BBA的平台", "国产整车是硬门槛。第一梯队国产他点名华为、蔚来、理想，买的时候蔚来也不看。智驾只信特斯拉FSD。"], ["国产迭代", "他认为一年换两代三代，电池和底盘都在换，是拿买车人当试验品。固态电池要等成熟、验证过。即便到了，甲方有仰望，他也不会买同一辆。仰望在他看来是父亲那一代的车。"], ["面子", "他说现在财不外露，十几年前超跑才是面子。"]]], ["5. 对未来购车的展望", [["只在宝马里换", "年轻时换得勤，现在不是。具体年份没有说。只考虑新一代i7或iX5，不看别的品牌。新世代内饰他觉得更科技，方向盘因为接受特斯拉所以也能接受。"], ["SUV没有被一概否定", "iX5在候选里。新卡宴看过，配额价他估算大约一百四十万，不值得。MPV他的结论是拿空间换了安全，空间不够不是换MPV的理由。"]]]]}, {"id": "wan", "name": "万婷婷", "city": "成都", "car": "奔驰S450L", "group": "S级", "kicker": "37岁 · 商务酒店 · 预算约一百万", "lead": "本次面聊围绕万婷婷从开了约十年的奥迪A6L换到奔驰S级展开。她和朋友合伙盘商务酒店，三口之家，女儿8岁。决策顺序是先品牌，再试驾通过性、内饰和乘坐舒适。7系她觉得太偏商务。下一台可以不区分国产还是BBA，前提是好开、能减负。", "sections": [["1. 个人背景与家庭情况", [["家庭与生意", "自报37岁，三口之家，女儿8岁。和朋友合伙盘一家商务酒店，大约五年。时间自己安排。丈夫自己开公司，公司有车，他不怎么开车。家里购车她做主。"], ["用车", "自己开。不去酒店、只在市区就打车。周末带家人去青城山、都江堰、眉山一带。访谈员看到大约一万八千公里。不是司机车，也不以后排为主。家里现在只有这一台。"]]], ["2. 购车背景", [["触发", "上一台A6L开了约十年，卖掉，不是留档置换。周围在换车，她要舒适、有屏幕、看上去有面子。"], ["预算", "大约一百万。迈巴赫销售说再贵二十多万就能买，她觉得轮毂大、太高调，出去玩不适合。也提到保值率。"], ["决策顺序", "先品牌，试驾通过性、内饰、乘坐舒适。事后才觉得氛围灯、音响、静音好。信息来自小红书、汽车之家、懂车帝和店，没有朋友指定品牌。"]]], ["3. 竞品对比与决策因素", [["宝马7系与奥迪", "7系更偏商务、更适合接待、更偏科技。奔驰是内饰、氛围灯和舒适，家用和商务都能用，而他们都是家用。A8L偏商务，A6开太久。"], ["新能源", "问界M9太高，主动驾驶不习惯，看完就没再看SUV。尊界在汽车之家看过，觉得炫，但传统观念还是想买豪华品牌，没有做对等比较。Model S太极简，不像豪华，也不像家用。"], ["腾势", "听过，没去看，怕小牌子几年后没了。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["这次品牌是门槛", "固化思维、保值，加上怕小牌子消失。谈下一次，她说不会再在意国产还是BBA，怎么开怎么方便。"], ["华为与比亚迪", "华为她用手机类比，认为可以有溢价，也能做到豪华。BBA电车在她看来是在学比亚迪和华为的车机。吉利、长安、比亚迪里她更信比亚迪，因为做得久。豪华她定义成做工和材质，同时也说国产没有底蕴。两句都在。"], ["纯电", "她没有用电池自燃拒绝。过几年都比较安全，路上已经很多。现在开久了宁可打车，所以下一台想要能减负的智驾。"]]], ["5. 对未来购车的展望", [["几年后，没有说死年份", "方向是智驾更完整、女性用的私密和娱乐、连屏、零重力或女王座椅。前备箱她觉得实用。"], ["价格预期", "这种新车她希望先卖五六十万，不要一上来一百多万。未知品牌只要真能省掉疲劳，她也可以。是否仍买奔驰，没有说。"]]]]}, {"id": "wangx", "name": "王轩", "city": "北京", "car": "奔驰S400L豪华型", "group": "S级", "kicker": "软件与集成 · 3系开了12年 · 成交价口径不一", "lead": "本次面聊围绕王轩在商务变多之后，用开了12年的宝马3系换成奔驰S400L展开。国际客户、国企和领导仍认传统大牌。生活和限号换开的是亲戚的蔚来ES8。纯电旗舰被南方长途续航挡住，增程他觉得跟加油没有区别。", "sections": [["1. 个人背景与家庭情况", [["工作", "自己做事，三方代理，做系统入库和数字化整合。2024年注册公司。年龄、婚姻没有自报。用车里有接孩子，后排会给小孩开平板。"], ["两台车的分工", "名下这台S自己开，不请专职司机。商务时奔驰用得多。生活、接孩子、限号换开蔚来ES8，车不在他名下，是亲戚的牌。商场车位窄，S不太开去。"]]], ["2. 购车背景", [["动机", "开始有一些商务用途，手里有闲钱，3系也该换了，开了12年。没为了尺寸买，是奔这个价位和这个级别的牌子。新牌子在客户眼里不靠谱。"], ["时间与价格", "他记得大约2025年一月提的新车。裸车、优惠和置换后的落地价前后改口，精确数字不采死，置换后的说法落在不到九十万到一百来万之间。"], ["后排", "太窄就没法办公、聊天。家里人评价后排通风和座椅好。空气悬架他觉得还是初级，没到客户那台迈巴赫的程度。"]]], ["3. 竞品对比与决策因素", [["宝马7系与沃尔沃", "7系新格栅想做得现代，他觉得不简洁。沃尔沃S90不行。雷克萨斯感觉不太好。"], ["尊界与华为", "他认的是华为，不认尊界、享界这些子品牌名字，因为动力总成是采购的，主要是软件和智驾。一块幕布隔绝不了声音。"], ["决策", "特殊的新客户、国企或领导面前还是得展现。私人场合和年轻人他觉得无所谓。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["传统大牌仍是商务门槛", "开新品牌，人觉得不靠谱。国产不是完全不看：要有市占率、做过商品车，不能是突然冒出来的名字。"], ["纯电与增程", "业务在南方，长途多，电的综合续航不够，高速风噪也比这台油车大。增程他觉得跟加油没什么区别。电池自燃会整车全损，安全性要先做到大约九成以上不再全损，他才肯信。"], ["具体牌子", "华为他愿尝试。极氪、领克有可能会考虑。蔚来、理想、赛力斯还没到豪华，缺自研底盘或车身。蔚来服务偏年轻。仰望的涉水、转椅他当成噱头，但因为有市占率，商务会考虑一下。"]]], ["5. 对未来购车的展望", [["没有时间表", "车型、预算都没有说。能落下来的是：悬架愿加几万，不愿加十万；能源希望更省油。现车48伏轻混他觉得鸡肋。"], ["不是直接换成纯电旗舰", "若只谈能源，他想改的是油耗和真正的混动，不是纯电S级。换品牌要安全和市占率。智驾若成熟他承认是趋势，仍会看牌子认不认。"]]]]}, {"id": "ding", "name": "丁鸿超", "city": "杭州", "car": "奔驰S级", "group": "S级", "kicker": "装修介绍兼滴滴豪华 · 落地八十多万、不到九十万", "lead": "本次面聊围绕丁鸿超购买一台能进滴滴豪华、档次够的奔驰S级展开。他自己开，也跑婚庆和商务接送。宝马和奥迪贵在哪里他说不清楚，也不准备换。新能源整类不考虑，国产车被他说成拼装。下一台仍是更好的燃油奔驰，最好有更高一级的后排。", "sections": [["1. 个人背景与家庭情况", [["工作", "2008或2009年开始开车。此前自己开装修公司，2023年注销，现在做装修介绍，空了就接单。周岁没有报。母亲有过老款C200。"], ["这台车怎么用", "自己开，也跑滴滴豪华、婚庆和商务接送。后排是乘客的位置。车挂营运。他说跑单是为了油钱、保险和停车费，不是靠这台车盈利。立体车库停不进去。"]]], ["2. 购车背景", [["动机", "要一台能进滴滴豪华、档次够的奔驰轿车。奔驰E也能进，他不拿E替代S。预算百万之内。当时油车折扣大，落地八十多万、不到九十万。"], ["和上一台的关系", "以前开过奔驰S，也开过GLK。上一台S400豪华上的香氛、小柏林和后排小屏，他觉得没什么用。这台他想补上后排座椅调节，口头说把它变成S480就好了。"]]], ["3. 竞品对比与决策因素", [["没有同等试驾宝马和奥迪", "他反问奔驰为什么比宝马7系和A8贵，但还是要奔驰。贵在哪里他说不清楚，也不准备为了这个换。"], ["极氪009", "同事的滴滴他坐过，四座光辉版像埃尔法，外观觉得好，但七八十万他宁可买二手油车。档次不够，所以选S。"], ["尊界", "对标迈巴赫来看。一个华为电车才做几年，被他说成拼装。若会买迈巴赫，也绝对不会考虑尊界。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["门槛锁在奔驰", "不是泛泛的德系。朋友从路虎换成理想、特斯拉、华为的大SUV，他不觉得那是消费降级，但自己新能源肯定不考虑。"], ["不考虑的原因", "自己里程不高，一箱油和充满电的差价不值得省。夏天电池不放心，他说想法比较传统。若只允许买电，他会说特斯拉，随即说特斯拉没有这么豪华，自己也不要冰箱彩电。"], ["智驾", "高速车少时能用，他打六分。城区关掉。载客时加速中急刹，他觉得危险。"]]], ["5. 对未来购车的展望", [["仍是燃油奔驰S", "时间没有说。方向是更好的奔驰，最好有S480那种后排。预算口径仍是一百万这一档，不是五十万。"], ["排除", "尊界和009排除。MPV因此不是下一台。"]]]]}, {"id": "pu", "name": "蒲润波", "city": "成都", "car": "尊界S800", "group": "尊界", "kicker": "银行信贷 · 裸车70.8万 · 办完八十多万", "lead": "本次面聊围绕蒲润波在银行做信贷、购买尊界S800五座展开。他未婚、快结婚，选五座是为了以后的儿童座椅。看过宝马7系和奔驰S级，输在智驾和油耗。家里有桩，标定续航670公里。传统品牌做豪华电轿，他心里五十万到顶；这台华为他已经花了八十多万。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "成都本地，银行信贷，受雇，自称上班的人，不是做生意的人。机构听成农行，是否农业银行不能确定。未婚，快结婚，还没有孩子。年龄没有自报。"], ["其他车", "第一台是路虎揽胜极光，大约四十多万。还有特斯拉Model 3，以及一台吉利银河，负责近郊和烂路。尊界因为已经有SUV，且他不喜欢SUV上下车。"]]], ["2. 购车背景", [["在展厅决定看", "万象城展厅觉得豪华、空间大。动机包括支持国货、新能源、不限号、坐着舒服，家里需要一台宽敞的车。访谈员说今年一月买的、用了约十个月。"], ["价格", "裸车70.8万，办完八十多万。进去之后觉得像百万级，内饰他感觉比看过的S级和7系还好。"], ["用途", "自己开，没有司机。通勤走二点五环。熟的客户可以坐副驾。见企业和同行老板时，车好一点更好说话。周末远途、烂路用另一台SUV。"]]], ["3. 竞品对比与决策因素", [["7系和S级", "淘汰原因是智驾差一截，加上能耗。极光城区他记得很高的油耗。若宝马、奔驰智驾只略低于华为且够用，他仍会考虑。"], ["蔚来与理想", "蔚来试驾智驾不行。理想智驾还可以，但没有轿车。问界若离开华为他不要。"], ["为什么是五座", "快结婚，长远要留儿童座椅。过年人多不是这台的定义。车大、转弯稍吃力，他仍不要便宜十来万的更小轿车。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["品牌祛魅", "过了靠车证明自己的年纪。国产做得好的，他认为不比BBA差。宾利再贵也没有智驾，他不买。奥迪智驾稍好于奔驰，宝马基本没有。"], ["华为是标准", "朋友在海外看到华为设备，他因此觉得技术靠得住。着火他认为是低概率。比亚迪进步大，但车身汉字掉档。腾势可以做大轿车，前提是快充和智驾。极氪做七八十万他心里接受不了。"], ["行政电轿的心理价", "传统车企做豪华电轿，五十万到顶。突然冒出的六七十、八十万新品牌，他会先看有没有负面，不当第一批车主。这台尊界是例外，买的是华为。"]]], ["5. 对未来购车的展望", [["没有置换时间表", "方向仍是五米以上的行政轿车，家用商用都要。动力继续电，希望做到自己不用开、能坐后排。"], ["德系", "智驾够用才会回头看。比亚迪最有机会做成大轿车，但是要去掉车身汉字，智驾要够。"]]]]}, {"id": "han", "name": "韩斐", "city": "北京", "car": "尊界S800", "group": "尊界", "kicker": "高校与期刊合作 · 裸车八十多万 · 落地九十多万", "lead": "本次面聊围绕韩斐用开了很多年、没有智能化的宝马7系，换成尊界S800四座展开。他在中国知网跑高校和出版社。选纯电是为了静音和加速。迈巴赫内饰他夸，智能化他否定。年长客户仍会问为什么不买宝马、奔驰，他不因此退回。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "教育行业，中国知网，做期刊论文电子化，要去高校和出版社谈合作。三口之家。年龄、配偶情况没有展开。"], ["日常不靠这台", "平时家里有宝马X1代步。接送孩子用小牛电动自行车，学校门口不好停。来访谈坐地铁，也是因为不好停。尊界主要在有商务场合时开。"]]], ["2. 购车背景", [["动机", "旧7系没有任何智能化。商务要大轿车，开小车太小气，SUV不适合高校。选纯电是为了更静、加速更好。四座中岛让两边有独立空间。"], ["价格", "裸车八十多万，落地九十多万。买它不是为了用价格撑面子。若同样配置卖到四十多万，他说仍会看，理由是配置和智驾。"], ["充电", "大约一个月一次。标称续航他称为六七百，够用，因为开得少。希望有闪充，免得临时没电让客户等。家桩没有提及。"]]], ["3. 竞品对比与决策因素", [["新7系与迈巴赫", "新7系他仍说自己是宝马用户，但觉得传统、电车像油改电、挤牙膏，杯架和门板不好用。迈巴赫内饰精致，和宝马一样没有智能化，太保守。7系和迈巴赫在管理层眼里的地位他也觉得比以前低。"], ["蔚来ET9", "纯电轿车里上市更早，顶级轿车布局和智驾不如华为。"], ["问界", "品牌规划他曾经更认可，但问界做的是SUV。理想没有轿车铺垫，他不接受一下子出顶级轿车。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["行政燃油品牌曾经是门槛", "他已经用华为跨过去。年轻客户更喜欢这台，传统一些的会问为什么不买宝马、奔驰。"], ["格局", "华为智驾第一档。“界”太多他觉得乱。蔚来、理想能跟华为智驾较劲。比亚迪没把智驾当卖点，但可以靠仰望。腾势有过奔驰合作的调性，Z9之后动作少，而且卖便宜了。长安、奇瑞独立做这个级别他觉得难。"], ["电池", "电车早期会担心，现在不担心，顶级系列再出问题说不过去。增程可以续航更长，他自己用得少，不需要。"]]], ["5. 对未来购车的展望", [["继续这个用途的行政纯电轿车", "时间没有说。离开德系已经发生，旧7系和迈巴赫不会因为年长客户的疑问再买回来。"], ["愿意比的对象", "蔚来、有轿车基础的吉利和比亚迪。理想要先有阶梯。L3他主要指望泊车变好。"]]]]}, {"id": "fan", "name": "范先生", "city": "杭州", "car": "尊界S800", "group": "尊界", "kicker": "证券与图文店 · 落地八十多万 · 至少七成家用", "lead": "本次面聊围绕范先生用奥迪A6换成尊界S800四座展开。公司已有奔驰S400，家里有卡宴，新能源里他认为只有S800比较合适。买的是华为，不是代工厂。不熟的客户仍用公司奔驰。远途不开这台纯电，浙江省内充电不便，公司接待MPV仍是燃油埃尔法。", "sections": [["1. 个人背景与家庭情况", [["家庭与两摊生意", "一家三口，有小孩，年龄没有报。自己做证券、金融和投资，和朋友合伙，公司十几人，做A股。和妻子还有几家图文广告打印店。父母不在杭州。"], ["其他车", "毕业后第一台大众速腾，然后2017年奥迪A6，开到换尊界。保时捷卡宴还在。公司有奔驰S400，正式接待用；人多才用丰田埃尔法。"]]], ["2. 购车背景", [["为什么是这台", "不再买油车行政轿车，因为公司已有S400；SUV已有卡宴。预算一百万以内。落地八十多万。决策是他自己，太太无所谓。一家店看完就买。"], ["怎么用", "杭州市区大多自己开。周边一两百到三百公里、自己不想开时用司机。这台至少七成家用。很多客户自己有车，外地来才去接。不熟或第一次接待用公司奔驰。"], ["续航", "标称六百多公里，他的感觉是四百出头。实打实五百以上才满意。远了开油车或坐飞机，所以没买增程。"]]], ["3. 竞品对比与决策因素", [["蔚来", "ET9知道，身边有ET7、ET5。蔚来配不上那个价，四十万左右也许会看。"], ["问界与享界", "朋友在买问界M9，他觉得车尾不好看。享界S9外观可以。"], ["太便宜反而不买", "这种车如果卖五十万，他不会买，太便宜，给别人看不合适。典藏高配约一百三十八万到一百四十万，他不会卖掉这台去换。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["华为是购买门槛", "若只是江淮他不买。奔驰在不熟的客户那里仍不会错。宝马、奥迪内饰比奔驰和尊界低一档。圈子里仍有BBA和保时捷。"], ["其他国产", "小米花哨，用华为的人不会转小米，他宁可买真帕拉梅拉。比亚迪智驾晚，暂时超不过华为。腾势D9有人买来当MPV，轿车少，中端偏高，略低于蔚来。仰望U8是玩车的人买的，他更想要卫士。极氪机械可以，智能化不行。"], ["刹车舆论", "他自己的车没有出现，圈子不太当回事。贬值快是后悔点，但购车时已决定当钱扔掉。"]]], ["5. 对未来购车的展望", [["没有临近的换车计划", "变动不大就不会为新款换。家用继续这种大轿车。接待陌生客户继续公司奔驰。人多用埃尔法。父母同住才考虑MPV。"], ["市区继续电，远途继续油或飞机", "不会为了增程再买一台。仰望若有行政轿车他会去看，但智能化还不如华为。"]]]]}, {"id": "yang", "name": "杨虎", "city": "成都", "car": "宝马530", "group": "5系", "kicker": "家具定制 · 家用大约八九成 · 成交价没有说死", "lead": "本次面聊围绕杨虎把家用和大约一成商务放在一台宝马530上展开。孩子大约2018年前后出生，妻子没有驾照，家里目前只有这一台。奔驰E内饰更豪华，但太商务。若纯家用，他会朝新能源走；这一成商用让他看重牌子认不认得出。5系不换，以后只打算增购SUV。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "卖定制家具，衣柜、鞋柜、橱柜。学金融，后来做设计，大约2020年前后自己单干。已婚，孩子快一岁时买的第一台大众迈腾，大约2018年底到2019年初。妻子没有驾照。父母大约六十岁，平时不跟着出门。"], ["用车", "家用大约八九成，商务大约一成。自己上班也开。家里只有这一台。客户不是路虎、观澜那种顶配客人，他要性价比。"]]], ["2. 购车背景", [["路径", "迈腾之后用过一台2017年的奔驰，是合伙人的车，开了几年，觉得操控和内饰过时，但没想上7系或S级。现车是新车换购。"], ["价格", "现场只谈到优惠，落地价没有说成一个确定数字。他拒绝过七八十万的商务SUV，多花二三十万他心里不乐意。"], ["要什么", "客户群匹配、略高半档；家用为主仍要一点商务认可；宝马操控；后排够用。山路转弯家人不容易晕车。不追求零到一百。"]]], ["3. 竞品对比与决策因素", [["奔驰与奥迪", "E300内饰最豪华，但和他八九成家用不匹配，太商务。A6被他说成迈腾换了壳，做工糙，优惠大等于调性下沉。"], ["新能源", "享界S9直接排除。蔚来ET7空间大，支撑和商务气不够，外观偏猎装。问界、理想像移动的家。腾势Z9 GT他很喜欢，说没结婚的话九成会买；已婚后的家用加商务使他没买。D9太商务、太大，家里停车会探出去。"], ["贵的SUV", "仰望、极氪、路虎要七八十万甚至更高，商务次数少。X5想要进口，超预算。GLC像家用，尺寸不如理想L9和问界M9。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["5系不再是身份", "现在BBA在降价卖，懂车的人不会再把5系看成很有身份，只是还过得去。零几年加价买奔驰的时代过去了。商务面子仍有用，只占大约一成使用。"], ["新能源的顾虑", "充电不缺。怕的是新品牌花三四十万被看成二十万的车，内饰和底盘像拼起来的，关键场合掉链子。要等别人先买、小毛病过去。"], ["比亚迪与极氪", "汉的价格和内饰离他要的商务还差一截。极氪被他看成吉利的亲民基因，父辈开过吉利，做豪华他不满意。"]]], ["5. 对未来购车的展望", [["5系不换，只增购", "不会两台都是轿车。SUV给孩子长大、父母年纪更大、东西更多，要视野和后备箱。5系留下接客。"], ["动力未定", "以后会把新能源放进考虑，不必然留在德系SUV，因为X5、GLC已经被尺寸、科技和价格否掉。"]]]]}, {"id": "he", "name": "何龙", "city": "成都", "car": "宝马530", "group": "5系", "kicker": "人事相关（听写不清）· 落地约四十万 · 家里还有特斯拉", "lead": "本次面聊围绕何龙用沃尔沃XC60换成宝马530展开。上一台SUV侧倾大、后排不如轿车。他订过问界又退，家里特斯拉还在。选530不是为了见客户，最后是爱人觉得好看。买完就后悔智驾只有半套。若重来，他会选智驾更完整的新能源。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "访问员按金融管理来问，他的回答听成“人件”，岗位不写死，按人事相关的听感保留。和爱人、孩子一起用车，两口子都会开。家里还有一台特斯拉。"], ["上一台", "2018年二手沃尔沃XC60，图便宜、不用购置税。2024年增购特斯拉，他记得二十多万。2025年用XC60置换530，特斯拉留下。"]]], ["2. 购车背景", [["为什么离开SUV", "XC60转弯侧倾大，后排不如轿车。这次燃油车锁定轿车。看新能源时反而主要看SUV，新能源轿车他明确说没看。"], ["成交", "预算大约四十万。办完落地他自己说差不多四十万，另有三十九万、加延保三十八万的说法。买完第二天就听说降价。"], ["不是为面子", "真为商务他反而觉得该买奥迪A6L。城里做事的人不靠这个，农村更讲面子。爱人觉得好看就够了。"]]], ["3. 竞品对比与决策因素", [["奔驰", "E300进店两次，新车味道冲，家里有小孩，没试驾就放弃。爱人进车后也同意。"], ["问界", "更早下过订，意向金五千，当晚退。原因是新车、市场没验证、电池磕碰和起火、维修只能回售后、防撞梁被说成单薄，以及华为和代工厂分利润。"], ["其他", "理想L6试驾右后悬架异响。领克900好看，混动纯电里程短。腾势D9试过，智驾过收费站要人工接，车大。比亚迪唐试过。决定性原因是后排、舒适、驾驶感，销售把智驾说得好，加上爱人坚持。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["豪华只数BBA这一类", "国内新品牌制造年限短，面子上算不上豪华。油车可以花到大约四十万。新能源他心里是二十多万到三十多万，因为更新快，像手机。"], ["最看好比亚迪做国产豪华", "因为三电，从低到高都有人买。合理价他说二十五到三十五万。腾势Z9 GT网上觉得好看，底盘太低，山区不合适，没见过实车。"], ["特斯拉", "驾驶认可，舒适差，坐着像硬板凳，不如国产新能源。技术他承认强，留作另一台。"]]], ["5. 对未来购车的展望", [["后悔智驾", "宝马这套他称为半套。2026年七八月一直在想。最想要的是高速和长途智驾。"], ["若重来", "会选智驾更完整的新能源，预算二十多万到三十多万，不一定留德系。车型更可能继续看当时那些SUV。现车没有说要卖掉的时间。"]]]]}, {"id": "chen", "name": "陈博", "city": "北京", "car": "宝马530Li", "group": "5系", "kicker": "旅游线路 · 一家三口 · 落地大约三十四万", "lead": "本次面聊围绕陈博把大众CC换成宝马530Li展开。她和丈夫、上初中的孩子住在一起，通勤不远，停车不熟练，所以更要轿车。品牌大约占一半，看的是售后还在、开出去不低。新能源她见过，没有认真试驾，卡在自燃、出远门充电和北方冬天续航。", "sections": [["1. 个人背景与家庭情况", [["家庭与工作", "丈夫开车送她来，住双井一带。公司做旅游，她主要做线路。一家三口，孩子上初中，学校离家大约两公里，不是每天都要接。年龄没有自报。"], ["通勤", "单程大约五公里。过国贸会堵到改坐地铁。家里没有SUV，这次也没把SUV放进购买名单。"]]], ["2. 购车背景", [["为什么换", "空间是换掉大众CC的原因之一。轿车开起来顺手，腿部更舒服。SUV视野好，转弯费劲、累。"], ["价格", "裸车大约三十一万，加在一起大约三十四万。预算原话听写混乱，前后文按三十五万以内理解，不是更高的数字。"], ["品牌的位置", "三十多万称不上特别豪华，也不是低端。她知道奔驰、宝马已经降到二十多万，不再用价格定义豪华。业务面子不是她的场景。"]]], ["3. 竞品对比与决策因素", [["奔驰与奥迪", "要尊严，奔驰更好；要动力，宝马。奥迪太传统。最后收在530。"], ["新能源没有进成交比较", "身边有问界、蔚来和小鹏。商场里看过蔚来，没有认真试驾。特斯拉只在网约车上坐过后排，减震差，内饰太素。"], ["智能化不是当时的条件", "华为、小米的智驾和车机她认为做得好，买这台时没把智能化当条件。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["两种面子", "宝马是经典传承，新能源是时尚年轻的豪华感，不是同一种。"], ["不买的原因", "自燃，出远门充电要等、还可能排队，北方冬天续航打折，她举例标称一千可能只剩七百。保值不如油车。小米出过事。"], ["以后可以考虑的条件", "智驾超过现在的L2、安全性更高，快充短到五到十分钟，电池是她信得过的牌子。外观要简洁、大气、一眼能认出品牌。"]]], ["5. 对未来购车的展望", [["仍更喜欢轿车", "尺寸可以更大。正常大小的SUV她说可以接受，不是下一台已经决定换SUV。"], ["德系没有说会离开", "她是让宝马把智能化补上，不是已经改选国产。时间没有说。"]]]]}, {"id": "zhang", "name": "张岳", "city": "北京", "car": "宝马5系尊享版", "group": "5系", "kicker": "运维工程师 · 落地五十三万多 · 上一台A6约十年", "lead": "本次面聊围绕张岳用开了约十年的奥迪A6L换成宝马5系尊享版展开。他是受雇的运维工程师，自己开、开得猛，要操控。家里充电不方便，纯电残值下降快，电车没有声音、起步太快，他觉得没有驾驶乐趣。这台才一年，下一台仍倾向轿车、燃油、德系。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "互联网公司的运维工程师，不是自己开公司。孩子刚上高中。爱人觉得5系后排偏硬，后排还会抱狗。年龄没有自报。"], ["上一台", "第一台马自达6，后来因为钓鱼岛抵制日系，换成刚换代的奥迪A6L，开了大约十年。4S置换只给九万多，他卖给认识的二手商十一万多。"]]], ["2. 购车背景", [["动机", "A6毛病出来了。自己开、开车猛，操控和动力好，家里人也觉得内饰好看。BBA之间平级换，往下的车开习惯了接受不了。"], ["成交", "2025年买的，开了不到一年。尊享版，落地五十三万多。540i六缸他觉得动力更有意思，但贵，没买。"], ["使用", "除了限行几乎天天开，一年大约三点七万公里。通州和房山是家庭路线。这台5系不跑商务。以前的A6跑过两三年商务。"]]], ["3. 竞品对比与决策因素", [["奔驰E", "E300L比这台贵大约四万，还不是顶配。坐着舒服，内饰和外观他觉得老、不时尚。插混优惠大，后备箱被电池占满，空气悬挂到年头更换很贵。"], ["奥迪", "再买一台A6他觉得还是那样。A7孩子喜欢溜背，进口当时六十万靠近七十万，过高。Q5只为附近颠簸路看过，没买。"], ["新能源试驾", "陪朋友或看活动，试过理想、问界、智界的智驾。理想的按摩他试到睡着，但认为只是减轻疲劳。没有自己下定。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["宝马", "别人说大宝马，会觉得高大上。他自己也承认，商务场合别人更认奔驰和奥迪，5系少。驾驶乐趣他要内燃机的声音，电车没声音、起步快，没什么意思。"], ["不买纯电", "家里充电很不方便。纯电折损特别大。A6开十年还能卖十几万。国内辅助驾驶他还认为在L2，不到能分清责任的级别就不安全。这是他的判断。"], ["国产豪华的苗子", "比亚迪最可能，因为电池和海外名声，再加上仰望。普通王朝车他仍看成大众车。腾势输在漆软，洗车工说不贴车衣不敢用力洗。"]]], ["5. 对未来购车的展望", [["这台才一年", "倾向仍是轿车、仍是油、仍在德系里比较。时间没有再说。"], ["电要同时说通", "家里能充电、残值说得通、智驾到他认为能分清责任的级别、用料扎实、车内没有散不去的味道。这些条件没有一条他说已经满足。堵车时他希望有更好的智驾介入。"]]]]}, {"id": "kong", "name": "孔庆凯", "city": "杭州", "car": "宝马530", "group": "5系", "kicker": "服装批发 · 落地大约四十一万 · 太太开小鹏", "lead": "本次面聊围绕孔庆凯把沃尔沃换成宝马530展开。他一直对宝马有好感，价格降到五十万以内才买。操控放在品牌前面。家里已有太太的小鹏MONA。530留下，下一台准备把小鹏换成华为智驾的纯电SUV。", "sections": [["1. 个人背景与家庭情况", [["生意与家庭", "做服装批发，实体门面缩了，现在更多靠线上和档口。员工从前两个收到一个，负责盘货发货。太太开小鹏MONA M03，接送孩子。530这台大约一年一点五万公里。"], ["上一台", "沃尔沃轿车，后文点出S60。朋友有S90，他认为偏商务，不必买到旗舰。当时想买宝马，记得五系五十多万，觉得贵。"]]], ["2. 购车背景", [["动机", "一直对宝马有好感，要操控和动力。理性他自估六成，四成是一直想买宝马、价格刚好降到承受范围内。太太第二次去店，觉得对得起宝马、有排面。"], ["成交", "2025年11月前后提车。裸车大约三十七万，含运动套件总共四十一万不到。若停在四十三万、还在五十万内，他仍会买，因为已经认准。"], ["面子的位置", "回村和见客户时宝马不用解释，问界和蔚来要向老人解释。他自己把档定在中等偏上，不是顶级商务。"]]], ["3. 竞品对比与决策因素", [["奔驰", "家里人觉得E太商务。燃油试驾车不齐，他试了插混，动力偏柔，调教不如宝马。奔驰价格他觉得现在最坚挺。"], ["奥迪与沃尔沃", "A6设计老、跟不上。沃尔沃的安全他仍认可，所以极氪、领克沾沃尔沃技术他加分。"], ["新能源轿车", "享界看过，想要华为智驾，但觉得牌子不是华为自家、动力没到位，没有认真看。尊界踏板新闻让他发怵，不因此否定问界。现有的新能源轿车他觉得少，SU7和S800不打算买。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["宝马的招牌是操控", "开过电车，快是快，缺少油车那种逐渐上来的力量。太太开电车他觉得不顺。"], ["国产顺序", "问界第一，因为华为智驾。蔚来第二，换电在江浙沪没问题，到三四线难。小鹏第三，MONA适合女性。理想第四，智驾他不放心，L9六十多万太贵。"], ["比亚迪与腾势", "主品牌网约车印象深，电池和保有量又让他觉得不会倒。腾势四五十万的SUV他会去看，不保证买。仰望MPV太长，他们家不常接客。"]]], ["5. 对未来购车的展望", [["530留下", "有闲钱再换，不是已经下定。换掉的是MONA，换成带华为智驾的纯电SUV，五座六座无所谓。不要再来一台油车SUV。"], ["若是轿车", "比5系更大、接近S级的纯电轿车，大约三十到三十五万，超过四十万犹豫。极氪轿车他单独说三十五万左右。"]]]]}, {"id": "zhu", "name": "诸博文", "city": "杭州", "car": "宝马5系", "group": "5系", "kicker": "自报楚博 · 30岁 · 自媒体 · 花费四十多一点", "lead": "本次面聊围绕诸博文增购一台四门宝马5系展开。她名下还有Z4和MINI，丈夫有保时捷718，两门车凑不齐出门。品牌她说大约八成，指的是认得出、看起来不会倒。享界S9试驾后差点买成，停在续航、绿牌像网约车和贬值。5系是工具，情绪在MINI上。", "sections": [["1. 个人背景与家庭情况", [["家庭", "自报楚博，30岁。山东人，来杭州七八年，已定居。丈夫是杭州本地人，做体育用品，自己有厂。两人同住，没有孩子。父母在山东，有宝马X3。当天开来的是MINI，不是5系。"], ["她名下的车", "毕业时家里让当时的男方挑了宝马3系，开了不到一年分手，换成自己喜欢的MINI。来杭州后有Z4、MINI，加上丈夫的718都是两门，所以增购5系。"]]], ["2. 购车背景", [["动机", "要四个门。排序她说：品牌（不会倒闭），外观辨识度（双肾和大灯），驾控好上手，然后才是空间。另有一句不能妥协的是外观。"], ["花费", "预算四十五到五十万。花费四十多一点，四十三万还是四十五万没有由她报成唯一数字。2025年12月提车，决策大约一两个月。"], ["城市约束", "杭州立体车库多，当年买房和车位绑在一起。M9这一级太大，平时最多四个人。"]]], ["3. 竞品对比与决策因素", [["奔驰与奥迪", "E太商务，朋友买了经常跑婚车。大标她认不出来，买E就该买立标。氛围灯更好看，但比5系贵三四万。奥迪很少看，她认为已经掉出一线。"], ["享界", "S9试驾过，外观好看，智驾可以放手，座舱能放咖啡、看手机，开起来没有想象中难，是差点买的一台。"], ["停下的原因", "续航焦虑。朋友的车在酒店前台被问是不是网约车。五十万买来，第二年可能只剩二十万。朋友的高合出事后找不到地方修。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["5系是工具", "情绪和品味在MINI上。她不太愿意把5系推荐给朋友，怕被说成还在买油车。品牌大约八成，主要指不会倒闭、认得出，不是拿去压商务场。"], ["增程", "她拒绝。两套系统怕坏，既然会用电就不想再加油。丈夫这几个月说油价涨，想再买一台电车，她说再等两年。"], ["其他牌子", "极氪太男性。腾势、岚图、梦想家像MPV，老气。比亚迪等于网约车，没看。阿维塔好看，怕倒闭。新世代宝马纯电的鲨鱼鳍和异形屏，她现在接受不了。"]]], ["5. 对未来购车的展望", [["没有时间表", "百万级要卖多台，两人拒绝。形态没有转向SUV，除非以后有孩子才考虑很大的车。"], ["纯电", "不要增程。要等保值、维修和品牌稳定。德系玩乐车他们打算留着。尊界不选，迈巴赫更好看，但新格栅太夸张，也不是现成的购买计划。"]]]]}, {"id": "li", "name": "李浩", "city": "成都", "car": "奔驰E300L豪华型", "group": "E级", "kicker": "美蛙鱼头火锅 · 落地40.98万 · 家里另有理想L8", "lead": "本次面聊围绕李浩在开始做加盟之后增购奔驰E300L展开。高里程的家用车已经从特斯拉换成理想L8。这台油车是为了对外接待：绿牌他觉得撑不住，也有客户坐电车晕车。家人建议轿车和体面。尊界同价以后会看，现在觉得溢价高。", "sections": [["1. 个人背景与家庭情况", [["生意与家庭", "2021年开始做美蛙鱼头火锅，先直营后加盟，成都有店，外地也有。两个孩子，老大上高中、私立住校，老二上初中。周末接，不用天天接送。父亲开过5系，后来换成比亚迪唐。"], ["两台车", "2021年Model 3开到大约2025年，接近二十万公里。2025年换成理想L8，不到一年接近八万公里。2026年4月增购E300，L8留下。限号日这台油车改打车。"]]], ["2. 购车背景", [["动机", "开始对外加盟，一个月大约两三拨人，机场去接。要一台BBA级别、家用加商务的车。车上先聊成都，事情在店里谈，不安排人坐后排。"], ["成交", "落地409800。预算大约五十万。买完两个月左右，听说成交价到了三十八万多。"], ["体面的程度", "比理想L8贵不了多少。身边人知道就值三四十万，不会觉得他特别有实力。父亲开过5系，所以他没有“只有奔驰才是商务”的执念。"]]], ["3. 竞品对比与决策因素", [["宝马与奥迪", "新5系试驾，操控可以，外观不如E300有时尚感。奥迪没进店，印象是官车、老气。S预算不够，C太小。GLC没必要，因为已经有L8。"], ["腾势D9", "看过，太像公车，朋友吃饭不合适。纯商务D9比E300强，兼顾自己用则差。"], ["决定", "家人建议轿车、体面，自用和商务都能顾，加上品牌。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["绿牌", "周围人觉得绿牌不撑场面。有客户坐电车晕车。他自己坐特斯拉、理想没问题。纯电不做这台商务车。"], ["华为与蔚来", "华为溢价高、代工，尊界还有踏板断裂的新闻，所以不考虑。再便宜一二十万他才说可以再看。蔚来输在换电和市区续航折扣。"], ["心理价", "尊界合理价他说三十多到四十万。腾势做到五六十万、六七十万他更容易接受。极氪009五六十万可以。仰望一百万不花。"]]], ["5. 对未来购车的展望", [["两台分开", "生意好的话大约三年后，E300可能看百万级轿车，S400或同价的尊界会放进评估，现在觉得尊界溢价高。L8按自己爱好换，可以继续新能源。"], ["商务那台", "仍要考虑那两到三成对外场合，绿牌还在意。德系会留在候选里，不是唯一。"]]]]}, {"id": "wangwg", "name": "王文光", "city": "成都", "car": "奔驰E350eL", "group": "E级", "kicker": "香料批发 · 落地四十四五万 · 家里有充电桩", "lead": "本次面聊围绕王文光为五口之家增购奔驰E350e插混展开。2019年的燃油E300现在父亲开。选插混是为了市区用电、长途当油车。纯电被长途收货和乡下充电劝退。享界发布会看了，造车时间和安全不放心。大约六年后他才考虑固态纯电。", "sections": [["1. 个人背景与家庭情况", [["生意与家庭", "做香料、卤料批发，客户走物流，不用这台车接。一家五口，父母和孩子。这台不到一年大约四万公里，他自己开，跑市区和长途收货。老E300父亲开，接孩子。"], ["充电", "家里有充电桩。真实纯电大约一百二十公里，市区够。长途不充电，当油车。限号是原因之一，不是唯一。"]]], ["2. 购车背景", [["为什么增购", "五口人一台不够。2019年燃油E300落地大约五十三到五十五万，当时优惠少。这台指导价他说五十三到五十五万，优惠后含税、保险、保养，落地四十四五万。预算四十到五十万。"], ["不是为了重新挣面子", "早年从起亚狮跑换到E300，和收货时别人看车有关。现在他说行情不看车，比价格和量。"]]], ["3. 竞品对比与决策因素", [["5系和A6", "去4S看过。内饰塑料感重，像二十万的车，不如一些二十多万的国产电车内饰。奔驰外观、氛围灯、座椅、连体屏明显更好。"], ["享界", "手机上看过华为和问界的发布会。国产新车上市时间短，稳定性和品质不放心。后排功能他用不到，操控和空间也不如这台奔驰。"], ["宝马纯电没去看", "以前开过一台小宝马，松油门速度掉得快，有晕车感。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["信北京奔驰", "造车时间久。两台都留奔驰是因为这个。纯电要等真实续航六百公里以上，标称他按六折理解。固态电池他说最迟2030年，针刺不起火之后才考虑。"], ["国产", "华为智驾认可，造车时间和安全不认可。小米附近有起火传闻，他归到提速和雨夜，不全是智驾。比亚迪、方程豹贵的车型质量过得去。腾势他觉得就值二三十万，以前做油车再改电，不算豪华。"], ["理想与蔚来", "理想的冰箱大沙发他没感觉，也不喜欢SUV。蔚来坐过，灰色调，觉得像二十万。"]]], ["5. 对未来购车的展望", [["六年到七年", "老的油车留给母亲或卖掉，他再买。目标是固态纯电。孩子高了、父母需要躺，可能从轿车改商务MPV。预算仍围绕四五十万，S级价格不值。"], ["腾势", "商务车留在“以后可以看”的名单里。德系不是口头承诺。"]]]]}, {"id": "tong", "name": "佟磊", "city": "北京", "car": "奔驰E260时尚版", "group": "E级", "kicker": "新房销售 · 落地三十七万多 · 家里还有别克GL8", "lead": "本次面聊围绕佟磊因为城里不好开七座，增购奔驰E260时尚版展开。两台都是蓝牌，限号才把几乎不开的GL8开出来。特斯拉试驾觉得好，腾势Z9 GT的造型喜欢，销售不让试。他接受纯电和插混，看不起增程。现在没有再买一台的钱。", "sections": [["1. 个人背景与家庭情况", [["工作与家庭", "房地产新房销售，大约八年。三口之家。住大兴，有时住海淀。收入按提成说，现在不稳定。妻子上班离家近，嫌停车，基本不开车。"], ["两台蓝牌", "别克GL8大约2017年买的，现在城里一周最多开一次，他说轮胎里长草。留下是为了指标。E260落地三十七万多，买的最低配时尚版。"]]], ["2. 购车背景", [["动机", "要离开大车。三口之家没必要老开七座。选E260是因为轿车好修、开奔驰的人相对少、内饰比宝马好。面子不是主线。"], ["价格后悔", "心里曾经放到五六十万。实际三十七万，他自己觉得买便宜了；现在看三十万出头就能买到，又觉得当时贵。事后觉得应买E300豪华，多座椅通风加热、音响和智驾。"], ["停车", "E级五米二左右他已经觉得超标。中国车普遍偏大，他想更小，但小而能修、价格又合适的没有。"]]], ["3. 竞品对比与决策因素", [["宝马与奥迪", "525路上人多，妹妹那台方向盘掉渣。A6偏商务、官车，而且他要AT，不要双离合。身边宝马多是X，他不想要越野。"], ["几乎定了的进口车", "阿尔法·罗密欧几乎要定，北京只有一家店，配件说不清。玛莎拉蒂Levante限量时四十来万他动心，后来变贵，而且是SUV。最后被销售说到国产奔驰。"], ["腾势与特斯拉", "Z9 GT造型、无框车窗他喜欢，销售讲不清还不让试。D9偏宽，车位吃力。特斯拉试驾觉得好。问界因为华为手机贬值，没信心。尊界没关注。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["对国产新能源没有信心", "这句话是在试过特斯拉之后仍买油车的总结。充电他先说小区不方便，后说这不是最大障碍，家门口有快充。"], ["增程", "看不起，觉得技术落后，不如直接买油车。理想MEGA试过，好开、舒服，但太大，而且他拒绝增程。纯电、插混可以。"], ["比亚迪", "不贬低别人，出租车在用，便宜但耐用。秦和红旗网约车坐着不舒服。进口车质量更好，国内维修更快，他为了维修时间妥协。"]]], ["5. 对未来购车的展望", [["现在没有再买的钱", "家里还闲着一台GL8。若重来，同品牌里选E300豪华，优先智驾，其次座椅通风加热。"], ["德系轿车仍是默认", "腾势Z9是唯一说出口的国产轿车例外。GL8若换大车，增程排除。"]]]]}, {"id": "wuyl", "name": "吴雨露", "city": "北京", "car": "奔驰E300豪华型", "group": "E级", "kicker": "自报吴雨露 · 30岁 · 台球厅 · 另有普拉多", "lead": "本次面聊围绕吴雨露增购奔驰E300豪华型展开。档案文件写作吴宇录，本人自报吴雨露。他30岁，自己开台球厅，已婚有孩子。家里有丰田普拉多。对奔驰立标的喜欢从十八岁就开始。新能源在他这里是几万块的代步，下一台目标是燃油奔驰S级。", "sections": [["1. 个人背景与家庭情况", [["自报", "吴雨露，30岁，台球厅老板，自己的爱好，不是合伙。已婚，有孩子。2025年12月买的E300豪华型。"], ["另一台", "丰田普拉多，大约前一年或再早一年买的，当时人不在北京，油耗高，所以第一台没有买奔驰。特殊路况才开SUV。"]]], ["2. 购车背景", [["动机", "很早就喜欢奔驰，老款不好看，喜欢这一款的样子。圈子里打台球的大多开奔驰，也有迈巴赫和S。朋友建议迈巴赫，他买不起。"], ["东北老家的对照", "老家开奥迪、迈腾的人多，他解释成省钱。奔驰贵，他认贵有贵的道理。"], ["使用", "自己开长途，北京到海南大约三千二百公里。妻子跑长途会把后排放倒。这台不是用来做稳定接待的。"]]], ["3. 竞品对比与决策因素", [["不进宝马店", "身边开宝马的人少。奥迪外观不喜欢，发动机觉得和迈腾一样。"], ["赛那", "为了家用长途看过，因为异响和空，淘汰。不是商务接待。"], ["秦Plus", "试了，晕车、不舒服。十来万和这台不是一档。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["必须是这个标", "别的品牌做成奔驰的样子，他也不会买。新能源在他嘴里是几万块，他就喜欢油车。二三十万的新能源不买。"], ["不信的点", "高速堵车充电排队。网上看到的辅助驾驶事故和电池自燃。没有试驾过新能源的智驾。身边有理想L9，他不喜欢电车。"], ["这台E级", "变道、泊车和远程启动他夸。讨厌自己车上的自动刹车太猛。仰望太贵，不看。"]]], ["5. 对未来购车的展望", [["下一台奔驰S级", "时间没有说。轿车、燃油，留在奔驰。新能源不在计划里。"], ["后排", "他希望E级后排再靠拢一点商务车的躺法。迈巴赫现在不行。"]]]]}, {"id": "ni", "name": "倪家杨", "city": "杭州", "car": "奔驰E级", "group": "E级", "kicker": "高校行政 · 第一台自己的车 · 预算约五十万", "lead": "本次面聊围绕倪家杨买下第一台自己的车、选择奔驰E级立标展开。他在高校做行政，一个人住，周末去父母家。最不能妥协的是品牌，并说是为了虚荣。极氪001试驾过，小米和特斯拉也考虑过。第一辆就要油车，因为更新太快，也怕追尾起火。", "sections": [["1. 个人背景与家庭情况", [["工作与居住", "高校教育和行政，朝九晚五，周末双休。一个人住，不跟父母。周末有时去父母家。上一台是父母开下来给他练手的本田缤智，现由母亲开。父亲有奥迪Q5。未婚，现在没有女朋友。"], ["用车", "通勤代步，江浙沪和合肥一带短途。带父母、学生或朋友。后备箱够用，没有大件要拉。"]]], ["2. 购车背景", [["动机", "工作刚稳定，父母觉得该考虑结婚、该有辆好车。他想体验老牌豪华感，并说是满足虚荣心。外观排在品牌前面，品牌占决策大约一半；最不能妥协的仍是品牌。搜车先搜奔驰E。买的是立标。"], ["价格", "预算大约五十万。成交有四十四万、四十六万等几种口径，没有收成唯一数字。他听说现在同配置大约三十七八万，觉得亏了五六万。"], ["轿车", "第一选择就是轿车，看着比SUV优雅。父母特别想让他买SUV，GLC价格和E差不多，他看着不喜欢。"]]], ["3. 竞品对比与决策因素", [["宝马与奥迪", "5系侧脸好看，前脸老、像大叔，也担心折扣还会再跌。A6差点进入选择，放弃是因为怕开A6压过领导。"], ["极氪、小米、特斯拉", "001试驾，服务和加速好，价格他觉得贵，豪华感不够。SU7太张扬。Model 3一直在考虑。问界只看一眼，太稳重。"], ["去标", "若把5系、A6、E的标都去掉，他完全不会买，觉得不如国产新能源二三十万好开。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["第一辆就要油车", "父母观念里电车仍是过渡。他自己的理由是更新换代太快，油车可以开七八年；追尾后怕电池起火。他举过问界、小米、特斯拉的事故谈论。"], ["其他牌子", "比亚迪三个字和网约车绑在一起。腾势他熟的是MPV。尊界在杭州见得比绍兴多，他归到别人的商务接待，不是自己开。岚图怕倒闭。仰望他认为是智商税。"], ["气场", "过年聚会认得出奔驰。车上的立标灯会提醒自己开的是奔驰。三四线城市会因为奔驰放行或留车位，杭州这种少。"]]], ["5. 对未来购车的展望", [["近期不换", "下一辆放到婚后，这台可能带不了孩子，会看MPV或SUV。现在没有这项安排。"], ["五六年后", "若新能源完全稳定会考虑。朋友若预算够、又要豪华和科技，他会推荐电车，不是无条件推荐这台E。"]]]]}, {"id": "zhou", "name": "周野", "city": "杭州", "car": "奔驰E级豪华型", "group": "E级", "kicker": "自报周野 · 41岁 · 医疗设备 · 落地四十六万", "lead": "本次面聊围绕周野用开了七八年的本田雅阁换成奔驰E级展开。档案文件写作周琰，本人自报周野。一家三口，儿子虚岁12岁。决策排序是内饰、舒适、外观、操控，品牌大约三成。一年大约一万公里，她认为要超过大约两万公里才值得买新能源。至少五年后才换，到时候要看L3。", "sections": [["1. 个人背景与家庭情况", [["家庭与公司", "自报周野，41岁。与丈夫和儿子一家三口。儿子虚岁12岁。她和合伙人经营医疗设备公司，大约二十人，时间比朝九晚五自由。丈夫做无纺布，工厂在德清，因为她说杭州有污染方面的要求。父母在德清，公婆在杭州但不同住。"], ["两台车", "她开这台E。丈夫开大众途锐。家中此前有过日产骐达和本田雅阁。接送孩子、上班、逛商场、拜访和投标都是她这台。"]]], ["2. 购车背景", [["触发", "雅阁开了七八年，又要年检。日系在她看来简陋，起步慢，座椅没有加热，屏幕几乎没有。周围都在换车，E价格下来了。"], ["花费与排序", "预算五十万以内。落地先说四十五万五或四十六万，随后确认四十六万，含保养套餐与否没有拆开。排序：内饰，舒适，外观，操控，品牌。品牌至少三成；没有这个标她觉得至少要便宜六万。另有一句最不能妥协的是外观。"], ["立标", "为了气场和出门工作的面子。大标她觉得更像自己一个人开。丈夫随她，丈夫本人喜欢SUV。孩子觉得E舒服，学校门口也在意。"]]], ["3. 竞品对比与决策因素", [["宝马5系", "不喜欢新内饰，连体曲面屏和水晶件太花，车尾偏方。既不像以前的运动5系，也不像奔驰那么精致。"], ["奥迪", "A6完全放弃，不好看，认可度下降，周围车主说异味。上汽奥迪口碑差。A7L只是看。"], ["蔚来与尊界", "ET9试驾过，换电概念她曾觉得适应，预算高，换电把底盘做重，保值和续航达成差。尊界看过、坐过四座，落地她估八九十万，超预算。真感性就会去买，这次是理性留下E。后来舆论多，信任下降。"]]], ["4. 对BBA与新能源豪华品牌的看法", [["里程", "一年大约一万公里。她认为要超过大约两万公里才值得买新能源。油车使用周期更长，新能源掉价快。"], ["腾势与极氪", "姐姐单位公务车是腾势D9，她坐过，说还行，内饰偏老，偏接待。极氪是性能、偏男性。腾势若对到奔驰S这一级，她说至少六十万。极氪到不了这个价。"], ["老品牌", "雷克萨斯在杭州有店关掉，她用来说明老品牌至少不会倒。不选新能源的前提下，她会推荐奔驰E。"]]], ["5. 对未来购车的展望", [["至少大约五年", "去年才买。她认为那时L3应已成熟运行。换车会跟上。形态仍按轿车在说，没有说改SUV。"], ["假设", "大尺寸国产新能源轿车至少四十五万左右。腾势六十万、L3在第一梯队、市场不再油电来回变，三五年后她愿意考虑置换。希望奔驰把辅助驾驶补上。"]]]]}];
const cities = ["全部", "成都", "北京", "杭州"];
const groups = ["全部", "迈巴赫", "7系", "S级", "尊界", "5系", "E级"];
let city = "全部", group = "全部", q = "", current = DATA[0].id;

const el = (id) => document.getElementById(id);
function chip(parent, labels, get, set) {
  parent.innerHTML = labels.map(l => `<button type="button" data-v="${l}" class="${get()===l?"on":""}">${l}</button>`).join("");
  parent.querySelectorAll("button").forEach(b => b.onclick = () => { set(b.dataset.v); render(); });
}
function filtered() {
  const s = q.trim();
  return DATA.filter(p => (city==="全部"||p.city===city) && (group==="全部"||p.group===group)
    && (!s || (p.name+p.city+p.car+p.group+p.kicker).includes(s)));
}
function render() {
  chip(el("cities"), cities, ()=>city, v=>city=v);
  chip(el("groups"), groups, ()=>group, v=>group=v);
  const list = filtered();
  if (!list.some(p => p.id===current) && list[0]) current = list[0].id;
  el("index").innerHTML = list.length ? list.map((p,i) => `
    <button type="button" class="person ${p.id===current?"on":""}" data-id="${p.id}">
      <span class="num">${String(DATA.indexOf(p)+1).padStart(2,"0")}</span>
      <span><strong>${p.name}</strong><span class="meta">${p.city} · ${p.car}<br>${p.kicker}</span></span>
    </button>`).join("") : `<div class="empty">没有匹配的档案</div>`;
  el("index").querySelectorAll(".person").forEach(b => b.onclick = () => { current = b.dataset.id; render(); });
  const p = DATA.find(x => x.id===current) || list[0];
  if (!p) { el("doc").innerHTML = ""; return; }
  const idx = list.findIndex(x => x.id===p.id);
  el("doc").innerHTML = `
    <p class="kicker">${p.city} / ${p.group}</p>
    <h2>${p.name}</h2>
    <p class="sub">${p.car} · ${p.kicker}</p>
    <p class="lead">${p.lead}</p>
    ${p.sections.map(([title, items]) => `
      <section>
        <h3>${title}</h3>
        <ul>${items.map(([label, text]) => `<li><em>${label}</em>${text}</li>`).join("")}</ul>
      </section>`).join("")}
    <div class="navrow">
      <button type="button" id="prev" ${idx<=0?"disabled":""}>上一位</button>
      <button type="button" id="next" ${idx>=list.length-1?"disabled":""}>下一位</button>
    </div>`;
  const prev = el("prev"), next = el("next");
  if (prev) prev.onclick = () => { if (idx>0) { current = list[idx-1].id; render(); el("doc").parentElement.scrollTop = 0; } };
  if (next) next.onclick = () => { if (idx<list.length-1) { current = list[idx+1].id; render(); el("doc").parentElement.scrollTop = 0; } };
  const index = el("index");
  const active = index.querySelector(".person.on");
  if (active) {
    const top = active.offsetTop, bottom = top + active.offsetHeight;
    if (top < index.scrollTop) index.scrollTop = top - 8;
    else if (bottom > index.scrollTop + index.clientHeight) index.scrollTop = bottom - index.clientHeight + 8;
  }
  el("doc").parentElement.scrollTop = 0;
  history.replaceState(null, "", "#"+p.id);
}
el("q").addEventListener("input", e => { q = e.target.value; render(); });
const hash = location.hash.slice(1);
if (DATA.some(p => p.id===hash)) current = hash;
render();
</script>
</body>
</html>
